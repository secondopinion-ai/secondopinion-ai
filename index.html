<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Second Opinion AI</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}.wrap{max-width:720px;margin:0 auto;padding:24px 18px}.brand{font-size:20px;font-weight:800;color:#5546d7;margin:20px 0 60px}.hero{text-align:center}.tag{color:#5546d7;font-weight:bold;font-size:13px;letter-spacing:1px}.hero h1{font-size:clamp(34px,8vw,52px);line-height:1.12;margin:18px 0}.hero p{font-size:17px;line-height:1.7;color:#586174}.panel{background:white;padding:24px;border-radius:20px;box-shadow:0 8px 30px #1a275010;margin-top:35px}label{display:block;font-weight:bold;margin:18px 0 8px}select,textarea{width:100%;padding:14px;border:1px solid #ccd2df;border-radius:10px;font-size:16px;background:white}textarea{height:150px;resize:vertical}.btn{width:100%;border:0;border-radius:10px;background:#5546d7;color:white;font-size:17px;font-weight:bold;padding:16px;margin-top:18px;cursor:pointer}.btn:disabled{opacity:.5}.note{font-size:12px;color:#697386;line-height:1.6}.result{display:none;margin-top:20px;padding:16px;background:#f0edff;border-radius:12px;line-height:1.7}.footer{text-align:center;color:#778094;font-size:12px;margin:35px 0}
</style>
</head>
<body><main class="wrap"><div class="brand">✦ Second Opinion AI</div><section class="hero"><div class="tag">THINK TWICE. DECIDE BETTER.</div><h1>AIに聞いた。<br>でも、本当に正しい？</h1><p>AIの回答をそのまま信じる前に。<br>別の視点から、見落としやリスクを確認しましょう。</p></section><section class="panel"><h2>AIの回答をチェックする</h2><p>確認したい質問と、AIから得た回答を入力してください。</p><label for="topic">チェックする分野</label><select id="topic"><option>商品・購入の判断</option><option>旅行・ホテル</option><option>仕事・キャリア</option><option>日常の意思決定</option><option>その他</option></select><label for="question">元の質問</label><textarea id="question" placeholder="例：15万円のノートパソコンを買うべき？"></textarea><label for="answer">AIからの回答</label><textarea id="answer" placeholder="確認したいAIの回答をここに貼り付けてください"></textarea><button class="btn" id="check">セカンドオピニオンを受ける →</button><div class="result" id="result" role="status"></div><p class="note">試作版です。現在は入力内容を画面上で確認するだけで、AIによる事実確認やWeb検索は行いません。パスワードや個人情報は入力しないでください。</p></section><div class="footer">Second Opinion AI · Think independently. Decide confidently.</div></main><script>document.getElementById("check").addEventListener("click",function(){const q=document.getElementById("question").value.trim();const a=document.getElementById("answer").value.trim();const r=document.getElementById("result");r.style.display="block";if(!q||!a){r.textContent="元の質問とAIからの回答の両方を入力してください。";return;}r.textContent="入力を受け付けました。これは試作画面のため、まだAIによる検証は実行していません。次の開発段階で、事実確認・見落とし・反対意見・代替案を分析する機能を接続します。";});</script></body></html>
